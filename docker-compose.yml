services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyftr-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - LLM_API_KEYS=${LLM_API_KEYS:-key_1_placeholder,key_2_placeholder}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,*
      - ENABLE_FAILURE_SIMULATION=${ENABLE_FAILURE_SIMULATION:-true}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini/gemini-2.0-flash}
      - MOCK_LLM=${MOCK_LLM:-false}
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: lyftr-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
    name: lyftr_sqlite_data
